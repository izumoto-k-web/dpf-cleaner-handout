<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DPFクリーナーの立会人向け提案・説明資料">
  <title>DPFクリーナー｜配布資料</title>
  <style>
    :root { --navy:#123047; --blue:#146c9c; --pale:#eaf5fa; --ink:#1c2a33; --line:#d8e0e4; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#f3f6f7; font-family:"Yu Gothic UI","Yu Gothic",Meiryo,sans-serif; line-height:1.7; }
    main { width:min(720px, calc(100% - 32px)); margin:0 auto; padding:48px 0; }
    .card { padding:32px; background:#fff; border-top:6px solid var(--blue); box-shadow:0 2px 12px rgb(18 48 71 / 10%); }
    .eyebrow { margin:0 0 8px; color:var(--blue); font-size:.88rem; font-weight:700; letter-spacing:.06em; }
    h1 { margin:0; color:var(--navy); font-size:clamp(1.65rem, 7vw, 2.25rem); line-height:1.35; }
    p { margin:18px 0 0; }
    .mobile-break { display:none; }
    .document { display:block; margin-top:28px; padding:22px; color:#fff; background:var(--navy); text-decoration:none; }
    .document:hover { background:var(--blue); }
    .document b, .document span { display:block; }
    .document b { font-size:1.12rem; }
    .document span { margin-top:5px; color:#d5ebf5; font-size:.92rem; }
    .notice { margin:26px 0 0; padding:16px 18px; border-left:5px solid var(--blue); background:var(--pale); font-size:.9rem; }
    footer { margin-top:20px; color:#5d6b73; font-size:.8rem; }
    @media (max-width:480px) { main { width:calc(100% - 24px); padding:28px 0; } .card { padding:24px 20px; } .mobile-break { display:inline; } }
  </style>
</head>
<body>
  <main>
    <article class="card">
      <p class="eyebrow">社内配布資料</p>
      <h1>DPFクリーナー<br>提案・説明資料</h1>
      <p>排ガス不適合車に対して、<br class="mobile-break">検査員の判断を確認したうえで、<br class="mobile-break">車両の状態に合った対応を<br class="mobile-break">説明するための資料です。</p>
      <a class="document" href="dpf-cleaner-guide.html">
        <b>立会人向け提案・説明資料を開く</b>
        <span>早見表・料金・立会人トーク<br class="mobile-break">提案前の確認項目</span>
      </a>
      <p class="notice">このページは社内利用を想定しています。URLの転送や社外共有はしないでください。</p>
    </article>
    <footer>DPFクリーナー導入資料</footer>
  </main>
</body>
</html>
